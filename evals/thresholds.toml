# Thresholds for `make eval-smoke`, the CI check that replays the committed recordings of the
# smoke documents (evals/datasets/eval-v1/smoke.json) with no model.
#
# The recordings are real: the answers of qwen3-vl:4b and Apple Vision on the `val` split, from
# the run at commit 2e007af on 2026-11-19 with prompt v3. The app's prompt v4 has the same fill
# text and changes only the type guide for lab and scan reports; a type-only check with v4 on
# every val document left these 22 types unchanged. Each rate is the value measured on these
# recordings less 2 points (the two Needs-a-look shares: plus 2 points); misfiles, wrong merges
# and secrets are exactly 0. These are regression guards, not targets, and nothing here is tuned
# on the `test` split. Measured: field_exact_photo 0.9798, field_exact_all 0.9866,
# line_recall_photo 0.9806, the other rates 1.0, both Needs-a-look shares 0.
#
# Each name is a number `evals.runner.smoke_metrics` computes; "min" must be reached or beaten,
# "max" must not be exceeded.

[smoke.min]
type_accuracy = 0.98
person_accuracy = 0.98
linked_accuracy = 0.98
field_exact_photo = 0.9598
field_exact_all = 0.9666
line_recall_photo = 0.9606
placement_matches_decision = 0.98
exact_copies_caught = 0.98
undo_same_path = 0.98
# Counts, so that a rate over nothing cannot pass: something was filed, copied and undone.
documents_placed = 1
exact_copies = 1
undo_tried = 1

[smoke.max]
silent_misfiles_per_100 = 0
needs_a_look_expected_clean = 0.02
filing_needs_a_look_expected_clean = 0.02
wrong_merges = 0
secrets_found = 0
cvv_stored = 0
inbox_left = 0
