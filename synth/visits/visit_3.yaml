title: Child with fever
speakers:
  doctor: Tara
  parent: Aman
medicines:
  - Paracetamol 250
  - Ondansetron 2
  - Amoxicillin 250
  - ORS
tests:
  - complete blood count
lines:
  - {speaker: doctor, text: "Hello, please come in and sit. This is Aarav, right? He is how old now?"}
  - {speaker: parent, text: "Yes doctor. He is five years old. He has had fever for three days and he is not eating anything."}
  - {speaker: doctor, text: "Three days. What is the highest temperature you have measured?"}
  - {speaker: parent, text: "Yesterday night it was 102.5. In the mornings it comes down to 100, but by evening it goes up again."}
  - {speaker: doctor, text: "Any cough, running nose, ear pain, or loose motions?"}
  - {speaker: parent, text: "A little cough and he vomited twice yesterday. No loose motions. He complains that his throat hurts when he swallows."}
  - {speaker: doctor, text: "Okay. Is he passing urine normally? When did he last pass urine?"}
  - {speaker: parent, text: "About four hours ago. He is drinking very little water, doctor, only some juice."}
  - {speaker: doctor, text: "Let me examine him. Aarav, open your mouth and say aah. The throat is red, and the tonsils are swollen with a few white spots. His temperature right now is 101.4 and his weight is 18 kilograms."}
  - {speaker: parent, text: "Is it a viral fever or an infection?"}
  - {speaker: doctor, text: "The white spots on the tonsils and the high fever suggest a bacterial throat infection. Lungs are clear, ears are normal, and the belly is soft. There is no rash and no neck stiffness."}
  - {speaker: parent, text: "That is a relief. What should we give him?"}
  - {speaker: doctor, text: "For fever, give Paracetamol 250 milligrams, which is five millilitres of the syrup, every six hours only if the temperature is above 100. Do not give more than four doses in a day."}
  - {speaker: parent, text: "I gave him Crocin drops yesterday. Is it the same?"}
  - {speaker: doctor, text: "Same medicine, but the drops are more concentrated. Please use the syrup I am writing so that the dose is correct for his weight."}
  - {speaker: parent, text: "Okay, doctor."}
  - {speaker: doctor, text: "For the vomiting, I am giving Ondansetron 2 milligrams, half a tablet dissolved on the tongue, only when he feels like vomiting, up to twice a day for two days."}
  - {speaker: parent, text: "And an antibiotic?"}
  - {speaker: doctor, text: "Yes, Amoxicillin 250 milligrams, one dose three times a day for five days. Please complete the full course even if the fever goes away by the second day."}
  - {speaker: parent, text: "Before food or after food?"}
  - {speaker: doctor, text: "After food or with a few biscuits, so that the stomach does not get upset. Shake the bottle well each time."}
  - {speaker: parent, text: "Understood. He refuses to drink water. What can I do?"}
  - {speaker: doctor, text: "Dehydration is the main worry. Give ORS, one small cup after every vomit or every hour, in small sips. Coconut water, rice kanji and dilute buttermilk are also fine."}
  - {speaker: parent, text: "Should I do a cold sponge when the fever is high?"}
  - {speaker: doctor, text: "Use a lukewarm cloth, not cold water, and dress him in light cotton clothes. Please do not cover him with blankets."}
  - {speaker: doctor, text: "Because he has had three days of fever, I would like to send a complete blood count, just to be sure that there is no other infection."}
  - {speaker: parent, text: "Can we do it today?"}
  - {speaker: doctor, text: "Yes, the lab is on the ground floor. The report will be ready in two hours, and you can show me on the phone."}
  - {speaker: parent, text: "Okay. When do we bring him back if he does not improve?"}
  - {speaker: doctor, text: "If the fever continues beyond tomorrow evening, come back. Come at once if he becomes very sleepy, refuses all fluids, passes no urine for eight hours, has fits, or develops a rash."}
  - {speaker: parent, text: "Yes doctor. Can he go to school?"}
  - {speaker: doctor, text: "Not for three days. He should be fever free for a full day before he goes back. I will write a certificate for the school."}
  - {speaker: parent, text: "Thank you, doctor. Aarav, say thank you."}
  - {speaker: doctor, text: "Bye, Aarav. Rest well, drink plenty, and I will see you after the blood test."}
