title: Blood pressure follow-up
speakers:
  doctor: Rishi
  patient: Aman
medicines:
  - Telma 40
  - Amlodipine 5
  - Ecosprin 75
  - Atorvastatin 10
tests:
  - lipid profile
lines:
  - {speaker: doctor, text: "Good morning, Mr. Venkatesh. Please sit down. How have you been since the last visit?"}
  - {speaker: patient, text: "Good morning, doctor. I have been fine mostly, but I get a mild headache in the mornings, maybe three days in a week."}
  - {speaker: doctor, text: "I see. Are you checking your blood pressure at home, as I had asked?"}
  - {speaker: patient, text: "Yes doctor. My son bought a machine. Every morning before tea I check it. The reading is around 150 over 94 on most days."}
  - {speaker: doctor, text: "That is still higher than where we want it. Today in the clinic it is 148 over 92. Your pulse is 78 and regular."}
  - {speaker: patient, text: "I was afraid it would be high. I had pickles and papad at my cousin's wedding last week."}
  - {speaker: doctor, text: "Salt is a big part of this, so please keep that down. Tell me, are you taking Telma 40 milligrams every day without missing?"}
  - {speaker: patient, text: "Yes, one tablet every morning after breakfast. Maybe I missed it twice this month when we travelled."}
  - {speaker: doctor, text: "Okay. Any swelling in the feet, cough, or dizziness when you stand up?"}
  - {speaker: patient, text: "No swelling. No cough. Sometimes a little dizzy if I get up fast from the sofa."}
  - {speaker: doctor, text: "That is good to know. Since the pressure is still high on one medicine, I am going to add a second one. I am starting Amlodipine 5 milligrams, one tablet at night."}
  - {speaker: patient, text: "At night, after dinner?"}
  - {speaker: doctor, text: "Yes, after dinner is fine. It can cause a little ankle swelling in some people, so tell me if you notice that."}
  - {speaker: patient, text: "Okay doctor. And the Telma continues as before?"}
  - {speaker: doctor, text: "Continue Telma 40 milligrams in the morning. Do not stop it on your own even if the readings look good."}
  - {speaker: patient, text: "Understood. Should I continue the aspirin also? The one my cardiologist gave."}
  - {speaker: doctor, text: "You mean Ecosprin 75 milligrams? Yes, continue that once a day after lunch. It protects your heart, and the stomach upset you had earlier has settled, so we do not need to change it."}
  - {speaker: patient, text: "And the cholesterol tablet, Atorvastatin?"}
  - {speaker: doctor, text: "Continue Atorvastatin 10 milligrams at bedtime. I want to check your numbers, so I am ordering a fasting lipid profile. Please do it after ten to twelve hours of fasting."}
  - {speaker: patient, text: "Can I take my medicines on the morning of the test?"}
  - {speaker: doctor, text: "Yes, take the Telma with a sip of water. Only skip your breakfast and tea until the blood is drawn."}
  - {speaker: patient, text: "Okay. What should my home readings be?"}
  - {speaker: doctor, text: "Aim for below 130 over 80. Write down the morning and evening readings for one week and bring the diary with you."}
  - {speaker: patient, text: "I will ask my wife to write it in the notebook. She is more regular than I am."}
  - {speaker: doctor, text: "That is a good idea. Also walk for thirty minutes daily, and reduce papad, pickle and packet snacks."}
  - {speaker: patient, text: "I walk in the park near the lake. I will try to go every day, not only on Sundays."}
  - {speaker: doctor, text: "Good. If you ever get chest pain, severe headache, or sudden weakness on one side, do not wait for the appointment. Go to the emergency room immediately."}
  - {speaker: patient, text: "Yes doctor, I understand."}
  - {speaker: doctor, text: "Let me also check your kidney function in the same sample, since two blood pressure medicines can affect it. I will add a serum creatinine to the form."}
  - {speaker: patient, text: "Fine. When should I come back?"}
  - {speaker: doctor, text: "Come back in four weeks with the lipid report and the diary. If the pressure is controlled, we will not add anything more."}
  - {speaker: patient, text: "Thank you doctor. Shall I take the new tablet from today?"}
  - {speaker: doctor, text: "Yes, from tonight. Amlodipine 5 milligrams after dinner, Telma 40 milligrams in the morning, Ecosprin 75 milligrams after lunch, and Atorvastatin 10 milligrams at bedtime. Is that clear?"}
  - {speaker: patient, text: "Yes, four tablets at four different times. I will keep the pill box ready."}
  - {speaker: doctor, text: "Perfect. The pharmacy downstairs has everything. Take care, Mr. Venkatesh, and see you in four weeks."}
  - {speaker: patient, text: "Thank you, doctor. Goodbye."}
