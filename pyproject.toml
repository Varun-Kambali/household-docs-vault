[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "household-docs-vault"
dynamic = ["version"]
description = "Private document vault that runs on the owner's Mac: files bills, policies and IDs from one inbox, finds them from a short prompt, and reminds before renewals"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Varun Kambali" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "pypdfium2",
    "pillow",
]

[project.scripts]
vault = "household_vault.cli:main"

[project.urls]
Repository = "https://github.com/Varun-Kambali/household-docs-vault"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "jiwer",
    "types-pyyaml",
]
# Generates the synthetic documents; never shipped in the wheel.
synth = [
    "reportlab",
    "numpy",
    "faker",
    "pydantic",
    "pyyaml",
]
# OCR engines compared in the reading spike; never shipped. Tesseract also needs the binary.
spikes = [
    "ocrmac; sys_platform == 'darwin'",
    "pytesseract",
    "pypdfium2",
    "pillow",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "httpx",
    "psutil",
    "mlx-whisper; sys_platform == 'darwin'",
    "parakeet-mlx; sys_platform == 'darwin'",
]

# LoRA fine-tune path spike: needs torch, so never in the default groups or CI.
finetune = [
    "torch",
    "torchvision",
    "transformers>=4.57",
    "peft",
    "accelerate",
    "safetensors",
    "pillow",
    "pypdfium2",
    "psutil",
    # llama.cpp's converter script needs these
    "sentencepiece",
    "protobuf",
    "numpy",
]

[tool.uv]
# CI and `make setup` skip the spikes group (macOS-only wheels); `make spikes-setup` adds it; `make finetune-setup` adds the finetune group.
default-groups = ["dev", "synth"]

[tool.hatch.version]
path = "src/household_vault/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/household_vault"]
# Editable installs also put synth/ on the path; a built wheel never contains it.
dev-mode-dirs = ["src", "synth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "synth"]

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["synth", "."]
addopts = "-ra --import-mode=importlib"
