name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_FROZEN: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # With UV_FROZEN set, `uv lock --check` only checks that the lockfile parses, not that
      # it matches pyproject.toml.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
        env:
          UV_FROZEN: "0"
      - run: uv sync
      - run: make lint
      - run: make test
  # Replays the committed recordings of the smoke documents through the reading scores and the
  # real worker, with no model, and fails when a number is below evals/thresholds.toml.
  eval-smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      - run: make eval-smoke
  # Builds the image, runs the app in it with the stand-in reader and takes a PDF through the
  # API. The real app runs natively on a Mac.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t household-docs-vault .
      - name: Check the version
        run: |
          want="household-docs-vault $(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/household_vault/__init__.py)"
          test "$(docker run --rm household-docs-vault vault)" = "$want"
      # Imports every module of the package inside the image, so a dependency that only the
      # dev or synth groups provide shows up here.
      - name: Import every module in the image
        run: |
          docker run --rm --entrypoint python household-docs-vault -c "
          import importlib, pkgutil, household_vault
          for m in pkgutil.walk_packages(household_vault.__path__, 'household_vault.'):
              importlib.import_module(m.name)
          print('imported ok', household_vault.__version__)"
      - name: Serve, then process a PDF
        run: |
          id=$(docker run -d -p 8710:8710 household-docs-vault)
          trap 'docker logs "$id" | tail -n 40; docker stop "$id" >/dev/null' EXIT
          up=0
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8710/healthz; then up=1; break; fi
            sleep 1
          done
          echo
          test "$up" = 1 || { echo "no answer from /healthz in 30 s"; exit 1; }
          # The web app is in the image: the page, its CSP, a script it loads, and an app path.
          curl -fsi http://localhost:8710/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fs http://localhost:8710/inbox | grep -q '<div id="root">'
          js=$(curl -fs http://localhost:8710/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          curl -fs "http://localhost:8710$js" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8710/v1/nothing)" = 404
          docker cp evals/datasets/eval-v1/health_policy-1-clean.pdf "$id":/data/vault/Inbox/policy.pdf
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8710/v1/activity | grep -q '"step":"needs_a_look"'; then
              echo "needs a look after $i s"; exit 0
            fi
            sleep 1
          done
          echo "no needs_a_look entry in 60 s"; exit 1
  # The browser app (web/). Its types are generated from the API's own description, so an API
  # change that is not carried through to src/api/schema.d.ts fails here.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
        working-directory: .
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        env:
          # pa11y-ci's puppeteer would download a Chrome; the a11y job uses the runner's own.
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Check src/api/schema.d.ts matches the API
        run: npm run types:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Vitest with coverage: each file of the app's logic needs 80% (vite.config.ts).
      - run: npm run test:coverage
      - run: npm run build
  # pa11y-ci with axe over the built app: every screen in web/pa11y.json, at 1440 and 375 px, in
  # the light theme and then the dark one (scripts/a11y.ts). The API is a stand-in that answers
  # with replies recorded from the synthetic vault, so no model is called.
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run build
      - run: npm run a11y
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
