name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_FROZEN: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # With UV_FROZEN set, `uv lock --check` only checks that the lockfile parses, not that
      # it matches pyproject.toml.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
        env:
          UV_FROZEN: "0"
      - run: uv sync
      - run: make lint
      - run: make test
  # Builds the image and runs the stand-in command. The real app runs natively on a Mac.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t household-docs-vault .
      - name: Run the image
        run: |
          want="household-docs-vault $(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/household_vault/__init__.py)"
          test "$(docker run --rm household-docs-vault)" = "$want"
      # Imports every module of the package inside the image, so a dependency that only the
      # dev or synth groups provide shows up here.
      - name: Import every module in the image
        run: |
          docker run --rm --entrypoint python household-docs-vault -c "
          import importlib, pkgutil, household_vault
          for m in pkgutil.walk_packages(household_vault.__path__, 'household_vault.'):
              importlib.import_module(m.name)
          print('imported ok', household_vault.__version__)"
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
