name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_FROZEN: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # With UV_FROZEN set, `uv lock --check` only checks that the lockfile parses, not that
      # it matches pyproject.toml.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
        env:
          UV_FROZEN: "0"
      - run: uv sync
      - run: make lint
      - run: make test
  # Builds the image and runs the stand-in command. The real app runs natively on a Mac.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t household-docs-vault .
      - name: Run the image
        run: test "$(docker run --rm household-docs-vault)" = "household-docs-vault 0.0.0"
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
