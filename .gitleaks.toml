# The default rules, plus one exception: a recording names its document by the SHA-256 of the
# document's files in a field called "key", which the generic-api-key rule takes for a secret.
# Every other rule still scans the recordings.
[extend]
useDefault = true

[[allowlists]]
description = "recording keys are SHA-256 hashes of synthetic documents"
targetRules = ["generic-api-key"]
paths = ['''^evals/recordings/''']
